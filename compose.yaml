services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mortgage-pricing-exception-service:local
    environment:
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: sqlite:////app/data/mortgage_pricing.db
      SQLITE_BUSY_TIMEOUT_SECONDS: ${SQLITE_BUSY_TIMEOUT_SECONDS:-5}
      DEMO_IDENTITY_MODE: header
      UI_TIMEOUT_SECONDS: ${UI_TIMEOUT_SECONDS:-10}
      LLM_MODE: "off"
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - application-data:/app/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,uid=10001,gid=10001,mode=0700
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    stop_grace_period: 10s
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  application-data:
