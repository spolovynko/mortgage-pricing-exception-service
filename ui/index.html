<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="api-timeout-ms" content="{{API_TIMEOUT_MS}}">
    <meta name="theme-color" content="#142c32">
    <title>Mortgage workspace</title>
    <link rel="stylesheet" href="/ui/styles.css">
    <script src="/ui/workspace.js" defer></script>
    <script src="/ui/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to workspace</a>
    <div class="shell">
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="sidebar-label">WORKSPACE</div>
        <nav id="navigation" class="nav" aria-label="Main navigation"></nav>
      </aside>
      <div class="workspace">
        <header class="topbar">
          <div id="breadcrumbs" class="breadcrumbs">Workspace</div>
          <div id="identity" class="identity"></div>
        </header>
        <main id="app" class="app" tabindex="-1"><div class="loading" role="status">Connecting to the service…</div></main>
      </div>
    </div>
  </body>
</html>
