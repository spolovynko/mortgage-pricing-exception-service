[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "mortgage-pricing-exception-service"
version = "0.1.0"
description = "Mortgage pricing exception service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_pricing"]
