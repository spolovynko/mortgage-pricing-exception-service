[build-system]
requires = ["hatchling==1.30.1"]
build-backend = "hatchling.build"

[project]
name = "mortgage-pricing-exception-service"
version = "0.1.0"
description = "Mortgage pricing exception service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "fastapi>=0.115,<1",
    "httpx2>=2,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.55,<2.1",
    "streamlit>=1.40,<2",
    "uvicorn>=0.32,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mortgage_pricing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]
